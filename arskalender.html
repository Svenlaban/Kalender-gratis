<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />

    <title>Årskalender | Kalender Gratis</title>
  </head>

  <body>
    <header>
      <a href="index.html" class="logo">
        <img src="images/logotyp-header.png" alt="Kalender Gratis" />
      </a>

      <button
        type="button"
        class="menu-button"
        aria-label="Öppna meny"
        aria-expanded="false"
        aria-controls="main-navigation"
      >
        <span aria-hidden="true">☰</span>
      </button>

      <nav id="main-navigation" aria-label="Huvudnavigation">
        <ul>
          <li><a href="index.html">Månad</a></li>
          <li><a href="arskalender.html" aria-current="page">År</a></li>
          <li><a href="om.html">Om &amp; kontakt</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="year-calendar" aria-labelledby="year-heading">
        <div class="calendar-controls">
          <button
            type="button"
            id="previous-year"
            aria-label="Visa föregående år"
          >
            <span class="button-arrow" aria-hidden="true">&lsaquo;</span>
            <span class="button-text">Föregående år</span>
          </button>

          <h1 id="year-heading">2026</h1>

          <button type="button" id="next-year" aria-label="Visa nästa år">
            <span class="button-text">Nästa år</span>
            <span class="button-arrow" aria-hidden="true">&rsaquo;</span>
          </button>
        </div>

        <div id="year-grid" class="year-grid">
          <!-- Årets månader skapas med js-->
        </div>
      </section>
    </main>

    <footer>
      <p>Kalender Gratis</p>
      <p>En enkel kalender utan onödiga distraktioner.</p>

      <nav aria-label="Sidfotsnavigation">
        <ul>
          <li><a href="index.html">Månad</a></li>
          <li><a href="arskalender.html">Årskalender</a></li>
          <li><a href="om.html">Om och kontakt</a></li>
        </ul>
      </nav>

      <p>&copy; 2026 Kalender Gratis</p>
    </footer>

    <script src="js/navigation.js"></script>
    <script src="js/kalenderdata.js"></script>
    <script src="js/arskalender.js"></script>
  </body>
</html>
